name: Defensive Alerts Cron

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 本番URLはリポジトリ変数 APP_BASE_URL で持つ。ここに直書きしないこと。
      #    直書きだとURLを変えるたびにコード変更＋pushが要る（2026-08-17にURL変更を
      #    検討した際、書き換えが必要な唯一の箇所がここだった）。
      #    変更は `gh variable set APP_BASE_URL --body "https://..."` だけで済む。
      #    未設定なら現行URLにフォールバックする（設定漏れでアラートが止まらないように）。
      - name: Call defensive-alerts cron endpoint
        env:
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://unsou-system.hibiki-app.workers.dev' }}
        run: |
          echo "base: $BASE_URL"
          curl -f -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/defensive-alerts"

      # エラー監視の日次まとめ（前日分・0件でも送る）。URL は上と同じく APP_BASE_URL 変数経由。
      - name: Call error-digest cron endpoint
        if: always()
        env:
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://unsou-system.hibiki-app.workers.dev' }}
        run: |
          curl -f -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/error-digest"
